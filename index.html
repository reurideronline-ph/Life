<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lotto Muse — PCSO projections vs actual</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true">◎</div>
      <div>
        <h1>Lotto Muse</h1>
        <p class="sub">PCSO 6/58 · 6/55 · 6/49 · 6/45 — projected vs actual, re-analysed by <span id="model-name">Muse Spark 1.3</span></p>
      </div>
    </div>
    <div class="actions">
      <span id="updated" class="muted"></span>
      <button id="btn-reload" class="ghost" title="Reload dashboard">↻ Reload</button>
      <button id="btn-run" class="primary" title="Fetch latest results, score projections and ask Muse to re-analyse">Fetch latest & re-analyse</button>
    </div>
  </header>

  <nav id="tabs" class="tabs" role="tablist"></nav>

  <main id="app">
    <div class="loading">Loading dashboard…</div>
  </main>

  <div id="progress" class="progress hidden" role="status">
    <div class="progress-card">
      <h3>Running pipeline</h3>
      <ol id="progress-list"></ol>
      <button id="progress-close" class="ghost hidden">Close</button>
    </div>
  </div>

  <footer class="foot">
    PCSO draws are random — every combination has the same chance each draw. Projections are a structured way to pick numbers, not predictions. Play responsibly.
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
